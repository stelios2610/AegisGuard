# AegisGuard fail2ban configuration
# Place in /etc/fail2ban/jail.d/aegisguard.conf

[sshd]
enabled  = true
port     = ssh
maxretry = 5
bantime  = 3600
findtime = 600

[aegisguard-vpn]
enabled   = true
filter    = aegisguard-vpn
logpath   = /var/log/aegisguard-ssl-vpn.log
maxretry  = 5
bantime   = 3600
findtime  = 300
action    = iptables-allports[name=VPN, protocol=udp]
